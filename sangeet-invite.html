<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sangeet — Vishad</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Parisienne&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo:#1b2a5b;
    --indigo-deep:#14204a;
    --cream:#f3ead3;
    --cream-2:#efe3c2;
    --gold:#c99a4b;
    --gold-2:#e7c27a;
    --olive:#5a6b2f;
    --olive-deep:#425020;
    --rose:#d89aa6;
    --leaf:#7fae5a;
    --leaf-deep:#3d6b3a;
  }
  html,body{margin:0;padding:0;background:#0b1230;color:var(--olive-deep);font-family:'Cormorant Garamond', serif;}
  html,body{height:100%; overflow:hidden;}
  body{
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(ellipse at 50% 40%, #1e2f65 0%, #0b1230 70%);
  }

  /* ---------- Stage (scaled to fit) ---------- */
  .stage{
    width:708px; height:1000px;
    position:absolute;
    left:50%; top:50%;
    transform-origin:center center;
    box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.3);
  }

  /* ---------- Indigo base ---------- */
  .bg{
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse at 50% 20%, #24356e 0%, var(--indigo) 45%, var(--indigo-deep) 100%);
    overflow:hidden;
  }

  /* Subtle paper noise */
  .bg::after{
    content:"";
    position:absolute; inset:0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.04) 0 2px, transparent 2px),
      radial-gradient(circle at 70% 60%, rgba(255,255,255,.03) 0 1.5px, transparent 1.5px),
      radial-gradient(circle at 40% 80%, rgba(255,255,255,.03) 0 2px, transparent 2px);
    background-size: 220px 220px, 180px 180px, 260px 260px;
    mix-blend-mode: screen;
    opacity:.6;
  }

  /* ---------- Vine SVG layers ---------- */
  .vines{position:absolute; inset:0; pointer-events:none;}
  .vines svg{position:absolute; top:0; bottom:0;}
  .vines .left{left:0; height:100%; width:230px;}
  .vines .right{right:0; height:100%; width:230px; transform:scaleX(-1);}

  /* vine draw-in */
  .vine-path{
    fill:none;
    stroke:var(--leaf);
    stroke-width:2.2;
    stroke-linecap:round;
    stroke-dasharray: 2400;
    stroke-dashoffset: 2400;
    animation: draw 3.2s ease-out .2s forwards;
    filter: drop-shadow(0 0 1px rgba(125,180,95,.4));
  }
  .vine-path.b{
    stroke:var(--leaf-deep);
    animation-delay: .4s;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .leaf, .bud, .lotus-bud{
    transform-origin: center;
    opacity:0;
    animation: pop .7s cubic-bezier(.3,1.6,.5,1) forwards;
  }
  @keyframes pop{
    0%{opacity:0; transform: scale(0) rotate(var(--r, 0deg));}
    70%{opacity:1; transform: scale(1.1) rotate(var(--r, 0deg));}
    100%{opacity:1; transform: scale(1) rotate(var(--r, 0deg));}
  }

  /* gentle sway loop after bloom */
  .sway{
    animation: sway 5s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes sway{
    0%,100%{ transform: rotate(-2deg); }
    50%{ transform: rotate(2deg); }
  }

  /* ---------- Scalloped arch card ---------- */
  .arch-wrap{
    position:absolute;
    left:70px; right:70px;
    top:50px; bottom:50px;
    opacity:0;
    animation: archIn 1.2s cubic-bezier(.2,.8,.2,1) 1.1s forwards;
  }
  @keyframes archIn{
    0%{opacity:0; transform: translateY(20px) scale(.985);}
    100%{opacity:1; transform: translateY(0) scale(1);}
  }
  .arch-wrap svg{position:absolute; inset:0; width:100%; height:100%;}

  /* ---------- Text panel ---------- */
  .panel{
    position:absolute;
    left:0; right:0; top:0; bottom:0;
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
    padding: 150px 90px 60px;
    box-sizing:border-box;
    color: var(--olive-deep);
  }

  .lotus-crest{
    width:54px; height:54px;
    margin-bottom: 14px;
    opacity:0;
    transform: scale(.6) rotate(-10deg);
    animation: crestIn 1.1s cubic-bezier(.2,.9,.3,1.2) 1.9s forwards, bob 4s ease-in-out 3s infinite;
  }
  @keyframes crestIn{
    to{opacity:1; transform: scale(1) rotate(0);}
  }
  @keyframes bob{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-4px); }
  }

  .reveal{
    opacity:0;
    transform: translateY(14px);
    animation: rise 1.1s cubic-bezier(.2,.9,.3,1) forwards;
  }
  @keyframes rise{
    to{opacity:1; transform: translateY(0);}
  }

  .thrilled{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size: 18px;
    letter-spacing: .2em;
    text-transform: uppercase;
    line-height: 1.5;
    color:#6a6a49;
    margin: 0 0 10px;
    animation-delay: 2.3s;
  }

  .sangeet{
    font-family:'Great Vibes', cursive;
    font-weight: 400;
    font-size: 96px;
    line-height: 1;
    color: var(--olive);
    margin: 8px 0 22px;
    letter-spacing: .01em;
    position:relative;
    animation-delay: 3.1s;
    text-shadow: 0 1px 0 rgba(255,255,255,.5);
  }
  .sangeet .shimmer{
    background: linear-gradient(100deg,
      var(--olive) 0%,
      var(--olive) 40%,
      #b6c06a 48%,
      #d9d894 50%,
      #b6c06a 52%,
      var(--olive) 60%,
      var(--olive) 100%);
    background-size: 220% 100%;
    -webkit-background-clip:text;
            background-clip:text;
    -webkit-text-fill-color: transparent;
            color: transparent;
    animation: shimmer 4.5s linear 4s infinite;
  }
  @keyframes shimmer{
    0%{ background-position: 100% 0; }
    100%{ background-position: -100% 0; }
  }

  .wedding-of{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size: 22px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color:#6a6a49;
    margin: 4px 0 8px;
    animation-delay: 3.9s;
  }

  .vishad{
    font-family:'Parisienne', cursive;
    font-weight: 400;
    font-size: 108px;
    line-height: 1.05;
    color: var(--olive);
    margin: 2px 0 30px;
    animation-delay: 4.4s;
    text-shadow: 0 1px 0 rgba(255,255,255,.5);
  }

  .date{
    font-family:'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 30px;
    letter-spacing: .02em;
    color:#6a6a49;
    margin: 0;
    animation-delay: 5.3s;
  }
  .date .ord{
    font-size: 18px;
    position: relative;
    top: -12px;
    margin-left: 2px;
    letter-spacing:0;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 2px;
  }

  .time{
    font-family:'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 28px;
    color:#6a6a49;
    margin: 4px 0 28px;
    animation-delay: 5.7s;
  }

  .divider{
    width: 170px; height: 14px;
    margin: 6px 0 26px;
    opacity:0;
    animation: rise 1s cubic-bezier(.2,.9,.3,1) 6.1s forwards;
  }
  .divider svg{width:100%; height:100%; overflow:visible;}
  .divider .line{
    stroke: var(--gold);
    stroke-width: 1.2;
    fill:none;
    stroke-dasharray: 120;
    stroke-dashoffset: 120;
    animation: draw 1.2s ease-out 6.2s forwards;
  }
  .divider .dot{
    fill: var(--gold);
    opacity:0;
    animation: fadeIn .4s ease-out forwards;
  }
  .divider .dot.center{ animation-delay: 6.8s; }
  .divider .dot.left  { animation-delay: 7.0s; }
  .divider .dot.right { animation-delay: 7.0s; }
  @keyframes fadeIn{ to{opacity:1;} }

  .venue{
    font-family:'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 19px;
    letter-spacing: .14em;
    text-transform: uppercase;
    line-height: 1.7;
    color:#6a6a49;
    margin: 0 0 24px;
    max-width: 440px;
    animation-delay: 6.8s;
  }
  .venue .hotel{ letter-spacing: .2em; }

  .dinner{
    font-family:'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 19px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color:#6a6a49;
    animation-delay: 7.4s;
  }

  /* ---------- Floating petals ---------- */
  .petals{position:absolute; inset:0; pointer-events:none; overflow:hidden;}
  .petal{
    position:absolute;
    width:14px; height:14px;
    top:-20px;
    opacity:0;
    animation: fall linear infinite;
  }
  .petal svg{width:100%; height:100%;}
  @keyframes fall{
    0%  { transform: translate3d(0,-40px,0) rotate(0deg); opacity:0; }
    10% { opacity: .9; }
    90% { opacity: .9; }
    100%{ transform: translate3d(var(--dx,40px), 1100px, 0) rotate(var(--rot,360deg)); opacity:0; }
  }

  /* Sparkle dots in indigo */
  .sparkle{
    position:absolute;
    width:3px; height:3px; border-radius:50%;
    background: radial-gradient(circle, #fff 0%, rgba(255,255,255,.2) 60%, transparent 70%);
    opacity:0;
    animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0; transform: scale(.6); }
    50%{ opacity:.9; transform: scale(1.2); }
  }

  /* replay button */
  .replay{
    position: fixed;
    bottom: 16px; right: 16px;
    background: rgba(255,255,255,.08);
    color: #f3ead3;
    border: 1px solid rgba(243,234,211,.3);
    padding: 8px 14px;
    font-family:'Cormorant Garamond', serif;
    letter-spacing: .18em;
    text-transform: uppercase;
    font-size: 12px;
    border-radius: 999px;
    cursor:pointer;
    backdrop-filter: blur(6px);
    transition: all .2s ease;
    z-index: 50;
  }
  .replay:hover{ background: rgba(255,255,255,.15); }

</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="bg"></div>

  <!-- sparkles in indigo area -->
  <div class="sparkles" id="sparkles"></div>

  <!-- original vine pattern: left & right columns -->
  <div class="vines">
    <svg class="left" viewBox="0 0 230 1000" preserveAspectRatio="none" aria-hidden="true">
      <!-- main vine -->
      <path class="vine-path" d="M 40 -10
        C 70 80, 20 160, 60 240
        S 20 400, 70 480
        S 30 640, 80 720
        S 40 880, 60 1010" />
      <!-- secondary vine -->
      <path class="vine-path b" d="M 110 -10
        C 80 100, 150 180, 110 260
        S 160 420, 120 500
        S 170 660, 130 740
        S 160 900, 130 1010" />

      <!-- leaves / buds / lotuses will be injected by JS for staggered timing -->
      <g id="flora-left"></g>
    </svg>

    <svg class="right" viewBox="0 0 230 1000" preserveAspectRatio="none" aria-hidden="true">
      <path class="vine-path" d="M 40 -10
        C 70 80, 20 160, 60 240
        S 20 400, 70 480
        S 30 640, 80 720
        S 40 880, 60 1010" />
      <path class="vine-path b" d="M 110 -10
        C 80 100, 150 180, 110 260
        S 160 420, 120 500
        S 170 660, 130 740
        S 160 900, 130 1010" />
      <g id="flora-right"></g>
    </svg>
  </div>

  <!-- falling petals -->
  <div class="petals" id="petals"></div>

  <!-- Scalloped arch card -->
  <div class="arch-wrap">
    <svg viewBox="0 0 568 900" preserveAspectRatio="none">
      <defs>
        <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#f6ecd2"/>
          <stop offset="50%" stop-color="#efe3c2"/>
          <stop offset="100%" stop-color="#e9dcb4"/>
        </linearGradient>
        <filter id="paper" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/>
          <feColorMatrix values="0 0 0 0 .78  0 0 0 0 .68  0 0 0 0 .45  0 0 0 .12 0"/>
          <feComposite in2="SourceGraphic" operator="in"/>
        </filter>
      </defs>

      <!-- Arch path: straight sides + scalloped top + flat bottom.
           Top row has 5 scallops (arcs) from x=20 to x=548 across y≈90.
           Width 528 / 5 = ~105.6 per scallop. -->
      <path id="archPath" d="
        M 20 910
        L 20 110
        A 52.8 52.8 0 0 1 125.6 110
        A 52.8 52.8 0 0 1 231.2 110
        A 52.8 52.8 0 0 1 336.8 110
        A 52.8 52.8 0 0 1 442.4 110
        A 52.8 52.8 0 0 1 548 110
        L 548 910
        Z"
        fill="url(#cream)"
        stroke="#c99a4b"
        stroke-width="2.5"/>

      <!-- inner thin gold line -->
      <path d="
        M 32 902
        L 32 118
        A 46.8 46.8 0 0 1 125.6 118
        A 46.8 46.8 0 0 1 231.2 118
        A 46.8 46.8 0 0 1 336.8 118
        A 46.8 46.8 0 0 1 442.4 118
        A 46.8 46.8 0 0 1 536 118
        L 536 902
        Z"
        fill="none"
        stroke="#c99a4b"
        stroke-width="1"
        opacity=".8"/>

      <!-- paper texture overlay within arch -->
      <use href="#archPath" filter="url(#paper)" opacity=".5"/>
    </svg>
  </div>

  <!-- Text panel -->
  <div class="panel">

    <!-- lotus crest -->
    <svg class="lotus-crest" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="none" stroke="#c99a4b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <!-- center petal -->
        <path d="M50 22 C44 34, 44 50, 50 62 C56 50, 56 34, 50 22 Z" fill="#f1e0b5"/>
        <!-- side petals -->
        <path d="M50 62 C38 58, 28 52, 22 42 C28 54, 36 62, 50 64 Z" fill="#f1e0b5"/>
        <path d="M50 62 C62 58, 72 52, 78 42 C72 54, 64 62, 50 64 Z" fill="#f1e0b5"/>
        <path d="M50 62 C32 64, 20 60, 12 52 C20 64, 32 70, 50 68 Z" fill="#f1e0b5"/>
        <path d="M50 62 C68 64, 80 60, 88 52 C80 64, 68 70, 50 68 Z" fill="#f1e0b5"/>
        <!-- base line -->
        <path d="M18 70 Q50 78 82 70" stroke-width="1.2"/>
      </g>
    </svg>

    <p class="thrilled reveal">
      We are thrilled<br/>
      to invite you to join us in a<br/>
      joyous
    </p>

    <h1 class="sangeet reveal"><span class="shimmer">Sangeet</span></h1>

    <p class="wedding-of reveal">To celebrate the wedding of</p>

    <h2 class="vishad reveal"><span class="shimmer">Vishad</span></h2>

    <p class="date reveal">May 12<span class="ord">th</span></p>
    <p class="time reveal">7:30 PM onwards</p>

    <div class="divider">
      <svg viewBox="0 0 170 14">
        <line class="line" x1="10" y1="7" x2="80" y2="7"/>
        <line class="line" x1="160" y1="7" x2="90" y2="7"/>
        <circle class="dot left"   cx="78" cy="7" r="2.2"/>
        <circle class="dot center" cx="85" cy="7" r="3.2"/>
        <circle class="dot right"  cx="92" cy="7" r="2.2"/>
      </svg>
    </div>

    <p class="venue reveal">
      <span class="hotel">Hotel Vihang's Inn</span><br/>
      Opp. Cine Wonder, Ghodbunder Rd, next to Vijay<br/>
      Sales - Ghodbunder, Thane West.
    </p>

    <p class="dinner reveal">Dinner to Follow</p>

  </div>
</div>

<button class="replay" onclick="location.reload()">Replay</button>

<script>
  /* ---------- Fit-to-viewport scaler ---------- */
  const stage = document.getElementById('stage');
  function fit(){
    const sw = stage.offsetWidth, sh = stage.offsetHeight;
    const vw = window.innerWidth, vh = window.innerHeight;
    const s = Math.min(vw / (sw + 40), vh / (sh + 40), 1);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  fit();
  window.addEventListener('resize', fit);

  /* ---------- Flora placement on vines ---------- */
  // Each entry: {x, y, type: 'leaf'|'bud'|'lotus', rot, size, delay}
  const floraPositions = [
    // along main vine
    {x: 55, y: 40, type:'leaf',  rot:-35, size:.9, delay:1.0},
    {x: 35, y: 110, type:'bud',  rot:-10, size:.9, delay:1.2},
    {x: 75, y: 170, type:'leaf', rot:20,  size:1,  delay:1.3},
    {x: 30, y: 240, type:'lotus', rot:-15, size:1, delay:1.5},
    {x: 80, y: 310, type:'bud',  rot:25,  size:.9, delay:1.6},
    {x: 40, y: 390, type:'leaf', rot:-25, size:1,  delay:1.8},
    {x: 85, y: 460, type:'lotus', rot:15, size:1.1, delay:2.0},
    {x: 35, y: 540, type:'bud',  rot:-20, size:.9, delay:2.1},
    {x: 75, y: 610, type:'leaf', rot:30,  size:.9, delay:2.3},
    {x: 30, y: 680, type:'lotus', rot:-10, size:1, delay:2.5},
    {x: 80, y: 760, type:'bud',  rot:20,  size:.9, delay:2.6},
    {x: 45, y: 840, type:'leaf', rot:-30, size:1,  delay:2.8},
    {x: 80, y: 920, type:'lotus', rot:10, size:1.1, delay:3.0},

    // along secondary vine
    {x: 130, y: 60, type:'leaf',  rot:40, size:.8, delay:1.1},
    {x: 100, y: 130, type:'lotus', rot:10, size:.9, delay:1.4},
    {x: 140, y: 210, type:'bud',  rot:-15, size:.85, delay:1.6},
    {x: 110, y: 290, type:'leaf', rot:25, size:.9, delay:1.8},
    {x: 150, y: 370, type:'lotus', rot:-10, size:1, delay:2.0},
    {x: 115, y: 450, type:'bud',  rot:20, size:.85, delay:2.1},
    {x: 145, y: 530, type:'leaf', rot:-35, size:.9, delay:2.3},
    {x: 110, y: 610, type:'lotus', rot:15, size:.95, delay:2.5},
    {x: 150, y: 690, type:'bud',  rot:-20, size:.85, delay:2.7},
    {x: 115, y: 770, type:'leaf', rot:30, size:.9, delay:2.9},
    {x: 145, y: 850, type:'lotus', rot:-10, size:1, delay:3.1},
    {x: 125, y: 940, type:'bud',  rot:15, size:.9, delay:3.3},
  ];

  const SVG_NS = 'http://www.w3.org/2000/svg';

  function makeLeaf(color='#7fae5a', stroke='#3d6b3a'){
    const g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('class','leaf');
    // almond-shaped leaf
    const p = document.createElementNS(SVG_NS,'path');
    p.setAttribute('d','M 0 0 C -8 -6, -8 -18, 0 -24 C 8 -18, 8 -6, 0 0 Z');
    p.setAttribute('fill', color);
    p.setAttribute('stroke', stroke);
    p.setAttribute('stroke-width','1');
    // center vein
    const v = document.createElementNS(SVG_NS,'path');
    v.setAttribute('d','M 0 -1 L 0 -22');
    v.setAttribute('stroke', stroke);
    v.setAttribute('stroke-width','.8');
    v.setAttribute('fill','none');
    g.appendChild(p); g.appendChild(v);
    return g;
  }

  function makeBud(color='#ffffff', stroke='#b3c29a'){
    const g = document.createElementNS(SVG_NS,'g');
    g.setAttribute('class','bud');
    // tulip-like bud
    const p = document.createElementNS(SVG_NS,'path');
    p.setAttribute('d','M 0 0 C -6 -4, -7 -14, 0 -18 C 7 -14, 6 -4, 0 0 Z');
    p.setAttribute('fill', color);
    p.setAttribute('stroke', stroke);
    p.setAttribute('stroke-width','1');
    // hint of inner petals
    const inner = document.createElementNS(SVG_NS,'path');
    inner.setAttribute('d','M 0 -2 L 0 -16');
    inner.setAttribute('stroke', stroke);
    inner.setAttribute('stroke-width','.6');
    inner.setAttribute('fill','none');
    g.appendChild(p); g.appendChild(inner);
    return g;
  }

  function makeLotus(color='#f5b9c5', stroke='#a35b75'){
    const g = document.createElementNS(SVG_NS,'g');
    g.setAttribute('class','lotus-bud');
    // pink lotus bud (multi-petal)
    const petals = [
      'M 0 0 C -4 -5, -4 -13, 0 -16 C 4 -13, 4 -5, 0 0 Z',
    ];
    const outerL = document.createElementNS(SVG_NS,'path');
    outerL.setAttribute('d','M 0 0 C -9 -3, -11 -11, -6 -15 C -2 -12, -1 -6, 0 0 Z');
    outerL.setAttribute('fill', color);
    outerL.setAttribute('stroke', stroke);
    outerL.setAttribute('stroke-width','.8');

    const outerR = document.createElementNS(SVG_NS,'path');
    outerR.setAttribute('d','M 0 0 C 9 -3, 11 -11, 6 -15 C 2 -12, 1 -6, 0 0 Z');
    outerR.setAttribute('fill', color);
    outerR.setAttribute('stroke', stroke);
    outerR.setAttribute('stroke-width','.8');

    const center = document.createElementNS(SVG_NS,'path');
    center.setAttribute('d', petals[0]);
    center.setAttribute('fill', color);
    center.setAttribute('stroke', stroke);
    center.setAttribute('stroke-width','1');

    g.appendChild(outerL); g.appendChild(outerR); g.appendChild(center);
    return g;
  }

  function placeFlora(groupId){
    const g = document.getElementById(groupId);
    floraPositions.forEach((f, i) => {
      // Outer group handles positioning via SVG attribute (no CSS conflict)
      const outer = document.createElementNS(SVG_NS, 'g');
      outer.setAttribute('transform', `translate(${f.x} ${f.y})`);

      // Middle group applies static scale+rotate
      const mid = document.createElementNS(SVG_NS, 'g');
      const size = f.size || 1;
      mid.setAttribute('transform', `scale(${size}) rotate(${f.rot})`);

      // Inner element has the CSS-driven pop+sway animation (transforms compose cleanly)
      let el;
      if (f.type === 'leaf')       el = makeLeaf();
      else if (f.type === 'bud')   el = makeBud();
      else                         el = makeLotus();
      el.style.animationDelay = (f.delay || 1) + 's';

      mid.appendChild(el);
      outer.appendChild(mid);
      g.appendChild(outer);
    });
  }
  placeFlora('flora-left');
  placeFlora('flora-right');

  /* ---------- Falling petals ---------- */
  const petalsBox = document.getElementById('petals');
  const petalSvg = (fill, stroke) => `
    <svg viewBox="0 0 20 20" aria-hidden="true">
      <path d="M10 2 C 14 6, 16 12, 10 18 C 4 12, 6 6, 10 2 Z"
            fill="${fill}" stroke="${stroke}" stroke-width=".8" opacity=".9"/>
    </svg>`;

  const petalColors = [
    ['#f5b9c5','#a35b75'],   // rose lotus
    ['#ffffff','#b3c29a'],   // white bud
    ['#e7c27a','#a37a3a'],   // gold
    ['#d89aa6','#8d4a62'],   // pink
  ];

  for (let i = 0; i < 22; i++){
    const p = document.createElement('div');
    p.className = 'petal';
    const [f, s] = petalColors[i % petalColors.length];
    p.innerHTML = petalSvg(f, s);
    p.style.left = (Math.random() * 100) + '%';
    const dur = 9 + Math.random() * 10;
    const delay = -Math.random() * dur; // start mid-fall
    const size = 10 + Math.random() * 14;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.animationDuration = dur + 's';
    p.style.animationDelay = delay + 's';
    p.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
    p.style.setProperty('--rot', (360 + Math.random()*360) + 'deg');
    petalsBox.appendChild(p);
  }

  /* ---------- Sparkles in indigo area ---------- */
  const sparkBox = document.getElementById('sparkles');
  sparkBox.style.position = 'absolute';
  sparkBox.style.inset = '0';
  sparkBox.style.pointerEvents = 'none';
  for (let i = 0; i < 40; i++){
    const s = document.createElement('div');
    s.className = 'sparkle';
    const onLeft = Math.random() < .5;
    const x = onLeft ? Math.random() * 22 : 78 + Math.random() * 22;
    s.style.left = x + '%';
    s.style.top = (Math.random() * 100) + '%';
    s.style.animationDelay = (Math.random() * 3.5) + 's';
    s.style.animationDuration = (2.5 + Math.random() * 3) + 's';
    sparkBox.appendChild(s);
  }
</script>

</body>
</html>
